# D-172 / fashion §6.3 — LOCAL verification service for the commerce surface.
#
# NOT A DEPLOYMENT MANIFEST. Nothing in staging, production or the Dokploy
# template references this file; it exists so the image built from
# `commerce/Dockerfile` can be started, probed and read on a developer machine
# under the same hardened posture a deployed slot would use (§6.3 G-3/G-4/G-6).
#
# THE FOUR PROPERTIES THIS FILE GUARANTEES
#
#   1. LOOPBACK ONLY, NO COLLISION (G-6). Published as `127.0.0.1:13000`.
#      3000 is avoided because a local `next dev` / control-plane run owns it;
#      55432 is PostgreSQL's (the smoke harness AND the engine stack both bind
#      it — they cannot run simultaneously, so this service never publishes a
#      database port at all). Containers on the default bridge reach the host
#      as `host.docker.internal`, which `extra_hosts` also provides on Linux.
#
#   2. EXPLICIT, OPTIONAL, FAIL-CLOSED ENV (G-4). Every value is a reference
#      with an empty default (`${VAR:-}`): a variable that is not exported on
#      the host reaches the container as an EMPTY STRING, which the app reads as
#      unconfigured and refuses (D-171 §2.2) — it never degrades into a guessed
#      target, a sample mode or a fake success. `env_file` is deliberately NOT
#      used: it requires the file to exist and would inject whatever keys it
#      happens to hold, so the wiring could not be audited from this file.
#
#   3. NO CREDENTIAL LITERAL (D-045/D-124). There is no default secret here to
#      leak, and the image bakes none. The dispatch token stays a `${VAR:-}`
#      reference for BOTH services, so the app and the scheduler can only ever
#      agree by reading the same host value — never by a literal in this file.
#
#   4. THE SCHEDULER IS ITS OWN SERVICE (B3). `commerce-scheduler` runs
#      `scripts/dispatch-scheduler.mjs` in a plain Node container: the runner has
#      no dependencies and is deliberately NOT part of the app image (the image
#      is a standalone Next build). It joins the app's NETWORK NAMESPACE rather
#      than the bridge, because the runner refuses every non-loopback target by
#      design (D-045/D-139) — inside `service:commerce-web` its `127.0.0.1:3000`
#      IS the app, so the loopback guard stays intact and no shared hostname has
#      to be invented, trusted or exceptions added to. It is LOCAL ONLY: no
#      restart policy, mock SMS, and the same fail-closed token gate as the app.
#      Starting it is an explicit operator command (`docker compose up`); nothing
#      in the repository starts it, and no stage references this file.
#
# The host variable `COMMERCE_DATABASE_URL` (the name the smoke harness already
# uses) is mapped onto the container's `DATABASE_URL`, the single variable the
# app reads. Inside a container `127.0.0.1` is the container itself, so a
# harness or engine database is addressed as
# `postgresql://…@host.docker.internal:55432/…`.
services:
  commerce-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: aobe-commerce-local:verify
    container_name: aobe-commerce-local

    ports:
      - "127.0.0.1:13000:3000"

    environment:
      # Canonical connection (host-provided, optional).
      DATABASE_URL: ${COMMERCE_DATABASE_URL:-}

      # Payment seam — mapped because the code reads them at call time:
      #   COMMERCE_PAYMENT_WEBHOOK_SECRET -> /api/webhooks/payment (503 when empty)
      #   ZARINPAL_*                      -> checkout + /api/payments/zarinpal/callback
      #                                    (every payment UNAVAILABLE when empty,
      #                                     the order stays PENDING, nothing faked)
      COMMERCE_PAYMENT_WEBHOOK_SECRET: ${COMMERCE_PAYMENT_WEBHOOK_SECRET:-}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-}
      # Non-secret switch; empty means "not sandbox" and the adapter refuses
      # without a merchant id anyway, so the default cannot enable a live charge.
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}

      # SMS / order-notification seam (§6.2) — mapped because `commerce/src`
      # DOES read these now (`src/server/notifications/sms.ts`,
      # `dispatch-endpoint.ts`); the earlier "not mapped, no module reads it"
      # note described the tree before the app-side outbox existed and would be
      # a false statement today.
      #   SMS_LIVE_ENABLED               -> empty means MOCK: messages are
      #                                     recorded and NOTHING is sent (D-045)
      #   KAVENEGAR_API_KEY / _SENDER    -> empty + live enabled is a REFUSAL
      #                                     (`SMS_LIVE_MODE_MISSING_CREDENTIAL`)
      #                                     that claims no queue row, never a
      #                                     silent fall back to the mock
      #   NOTIFICATIONS_DISPATCH_TOKEN   -> empty makes
      #                                     POST /api/internal/notifications/dispatch
      #                                     answer 503 DISPATCH_NOT_CONFIGURED
      # A real key is owner-supplied and belongs in the host environment (or a
      # secret store), never in this file (D-045/D-124).
      # Explicit `false` default: mock delivery is the local contract, and live
      # delivery needs a deliberate host-side override plus owner credentials.
      SMS_LIVE_ENABLED: ${SMS_LIVE_ENABLED:-false}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      NOTIFICATIONS_DISPATCH_TOKEN: ${NOTIFICATIONS_DISPATCH_TOKEN:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Local verification only: a crash should stay visible instead of being
    # papered over by a restart loop.
    restart: "no"

    # The hardened posture the image is built for, exercised on every run.
    read_only: true
    tmpfs:
      - /tmp
      # Next writes its image/ISR cache here; a tmpfs keeps the rootfs immutable.
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Stage D resource floors, mirrored so the local run is representative.
    mem_limit: 512m
    cpus: 1.0

    # Same probe as the image's HEALTHCHECK, restated so `docker compose up
    # --wait` fails loudly instead of trusting an unverified container. `/healthz`
    # answers 503 when the canonical connection is absent or unreachable, so a
    # container started without `COMMERCE_DATABASE_URL` is UNHEALTHY on purpose:
    # it is serving nothing, and saying so is the point (D-171 §2.2).
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  # §6.3 B3 — the LOCAL outbox ticker. `node:20-alpine` matches the host
  # toolchain (Node 20.16) and the runner's only requirements: built-in `fetch`
  # and `node:timers/promises`. One file is mounted read-only — no build context,
  # no `npm install`, no dependency the local machine does not already have, and
  # nothing that could drift from the script the tests in `src/` exercise.
  commerce-scheduler:
    image: node:20-alpine
    container_name: aobe-commerce-scheduler

    # Shares the app's network namespace instead of getting its own address. The
    # runner validates its target and refuses anything that is not 127.0.0.1 /
    # localhost / ::1, so this is the only shape that reaches the app WITHOUT
    # weakening that guard (header, point 4).
    network_mode: "service:commerce-web"

    # Wait for `service_healthy`, not merely `started`: the probe also proves the
    # canonical connection, so the scheduler's first tick cannot land on an app
    # that would answer DB_NOT_CONFIGURED.
    depends_on:
      commerce-web:
        condition: service_healthy

    working_dir: /app
    volumes:
      - ./scripts/dispatch-scheduler.mjs:/app/dispatch-scheduler.mjs:ro
    command: ["node", "/app/dispatch-scheduler.mjs", "--watch"]

    environment:
      # NOT taken from the host on purpose: inside this namespace the target is a
      # fact, not a setting. A host `NOTIFICATIONS_DISPATCH_URL` is ignored here
      # because any other loopback port would be a different service, and the
      # runner would (rightly) refuse it.
      NOTIFICATIONS_DISPATCH_URL: http://127.0.0.1:3000/api/internal/notifications/dispatch

      # The SAME reference the app reads (header, point 3). Empty on both sides
      # means the endpoint answers 503 and the runner exits 3 with a named
      # refusal rather than looping quietly; a matching value drains the queue
      # through the mock channel.
      NOTIFICATIONS_DISPATCH_TOKEN: ${NOTIFICATIONS_DISPATCH_TOKEN:-}

      # Local cadence: quick enough to watch a PAID order settle, slow enough not
      # to poll in a tight loop. The runner floors this at 1000 ms.
      NOTIFICATIONS_DISPATCH_INTERVAL_MS: ${NOTIFICATIONS_DISPATCH_INTERVAL_MS:-15000}
      NOTIFICATIONS_DISPATCH_HTTP_TIMEOUT_MS: ${NOTIFICATIONS_DISPATCH_HTTP_TIMEOUT_MS:-5000}

      # Restated inside the scheduler so the local ticker can never be the thing
      # that sends a real SMS, whatever the app is configured with.
      SMS_LIVE_ENABLED: "false"

    # Same posture as the app: no privilege escalation, no capabilities, an
    # immutable rootfs (`/tmp` is the only writable path).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    mem_limit: 128m
    cpus: 0.5

    # A crash is the signal (`3` = wrong/absent token, `4` = app unreachable);
    # a restart policy would hide exactly what an operator needs to read.
    restart: "no"
