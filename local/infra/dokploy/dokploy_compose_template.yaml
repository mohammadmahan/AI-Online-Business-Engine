# Dokploy Stage D — canonical compose template (D-144)
#
# TEMPLATE, not a deployable manifest: `stage_d_compose_generator.py`
# renders `docker-compose.dokploy.yaml` from this file. Every credential
# is a fail-closed `${VAR:?reason}` reference (D-045) — a value is
# injected by the deployment layer's secret envelope at deploy time and
# NEVER exists in Git, logs, or generated artifacts (D-124).
#
# Network isolation contract (battery-pinned):
#   - `backend`  (internal: true) — postgres-ssot + redis + app +
#     telemetry only. No gateway attachment. No published ports.
#   - `edge`     — ONLY the app-orchestrator attaches; this is the sole
#     surface the Dokploy/Traefik gateway may route (80/443 terminate at
#     the gateway, never on a container).
#   - postgres/redis declare ZERO `ports:` — database and cache are
#     unreachable from outside the backend bridge by construction.
#
# Healthchecks match `local/src/infra/infra_health_probe.py` semantics:
#   pg_ssot          -> `SELECT 1` answers            (pg readiness)
#   redis_broker     -> PING answers PONG             (broker readiness)
#   worker heartbeat -> app /healthz worker beat      (freshness)
#   telemetry        -> app /healthz telemetry state  (circuit not OPEN)
#
# Resource ceilings mirror compose.prod.yml sizing (Stage C floors).

version: "3.9"

services:
  postgres-ssot:
    # The PostgreSQL SSOT (D-055 lineage). Internal backend ONLY.
    image: {{POSTGRES_IMAGE}}
    environment:
      POSTGRES_DB: ${CANONICAL_DB_NAME:?Stage D required — canonical SSOT database name}
      POSTGRES_USER: ${CANONICAL_DB_USER:?Stage D required — canonical SSOT user}
      POSTGRES_PASSWORD: ${CANONICAL_DB_PASSWORD:?Stage D required — canonical SSOT password (secret envelope injects the value; never commit)}
      TZ: Asia/Tehran
    volumes:
      - canonical_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    read_only: true
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    # Broker / transient cache (D-141 Stage C contract): fail-closed
    # AUTH, noeviction durability, AOF persistence. Internal backend ONLY.
    image: {{REDIS_IMAGE}}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Stage D required — redis broker password (secret envelope injects the value)}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Stage D required — redis broker password (secret envelope injects the value; never commit)}
    volumes:
      - redis_data:/data
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  app-orchestrator:
    # Application core / worker pools / sync daemons. The ONLY service
    # attached to the edge network — the sole gateway-routable surface.
    image: {{APP_IMAGE}}
    environment:
      # Individual strict refs only — the app composes connection URLs
      # at runtime. A password-bearing URL is never an env var (D-124).
      CANONICAL_DB_HOST: postgres-ssot
      CANONICAL_DB_PORT: "5432"
      CANONICAL_DB_NAME: ${CANONICAL_DB_NAME:?Stage D required — canonical SSOT database name}
      CANONICAL_DB_USER: ${CANONICAL_DB_USER:?Stage D required — canonical SSOT user}
      CANONICAL_DB_PASSWORD: ${CANONICAL_DB_PASSWORD:?Stage D required — canonical SSOT password (secret envelope injects the value)}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Stage D required — redis broker password (secret envelope injects the value)}
      WORKER_HEARTBEAT_PATH: /healthz/worker
      TELEMETRY_STATE_PATH: /healthz/telemetry
    depends_on:
      postgres-ssot:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - edge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz/worker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  telemetry-circuit:
    # Metrics sink / log aggregator seam wired to the D-089 notification
    # boundary. Internal backend ONLY — its exposition is scraped by the
    # app, never exposed.
    image: {{TELEMETRY_IMAGE}}
    environment:
      TELEMETRY_BIND: 127.0.0.1:9091
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9091/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  canonical_data: {}
  redis_data: {}

networks:
  backend:
    internal: true
  edge: {}
